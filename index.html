<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EMG — Sistema de gestión integral</title>
  <meta name="description" content="EMG: ERP integral para PyMEs de construcción, movimiento de suelos y agro. Facturación electrónica, gestión y acceso desde cualquier lugar." />
  <meta property="og:title" content="EMG — Sistema de gestión integral" />
  <meta property="og:description" content="Un solo sistema para gestionar tu empresa: ERP + web, desde la oficina o desde cualquier lugar." />
  <meta property="og:type" content="website" />
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --acc:#3b82f6; --txt:#e2e8f0; --mut:#94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--txt);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { max-width: 640px; text-align: center; }
    .logo { font-size: 2.5rem; font-weight: 800; letter-spacing: 2px; color: #fff; margin-bottom: 8px; }
    .logo span { color: var(--acc); }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 16px 0 12px; }
    p { color: var(--mut); line-height: 1.6; font-size: 1.05rem; }
    .badge { display: inline-block; margin-top: 24px; padding: 8px 16px; border: 1px solid var(--acc);
             border-radius: 999px; color: var(--acc); font-size: .9rem; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">E<span>M</span>G</div>
    <h1>Sistema de gestión integral para tu empresa</h1>
    <p>Estamos preparando nuestro sitio. Muy pronto vas a poder conocer todo lo que
       EMG puede hacer por la gestión de tu empresa de construcción o agro.</p>
    <span class="badge">Sitio en construcción</span>
  </main>
</body>
</html>
